[project]
name = "token-service"
version = "0.1.0"
description = "Internal Zoho OAuth token cache with proactive refresh (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2,<3",
    "python-dotenv>=1.0.0",
    "certifi>=2026.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]
