services:
  token-service:
    # CI builds this image and pushes to GHCR. `docker compose pull` on
    # the server resolves to it. Build block retained as a fallback for
    # local dev (no GHCR auth needed).
    image: ghcr.io/ansimran/zoho-token-distributor/token-service:latest
    build:
      context: .
      args:
        BUILD_DATE: "${BUILD_DATE:-unknown}"
        VERSION: "${VERSION:-0.1.0}"
    container_name: token-service
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"  # Host-only — reachable from same machine, not from internet.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
